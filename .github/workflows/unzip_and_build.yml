name: Remove Widgets and Force Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          unzip -o InfinityClock-Part3.zip -d .

      - name: Block & Remove Problematic Widget Files
        run: |
          # Remove entire widget source directory to stop Kotlin compiler errors
          rm -rf app/src/main/java/com/infinityclock/app/widget
          
          # Remove widget declarations from Manifest so build succeeds
          sed -i '/<receiver android:name=".*Widget.*/,/<\/receiver>/d' app/src/main/AndroidManifest.xml || true
          sed -i '/<activity android:name=".*Widget.*/,/<\/activity>/d' app/src/main/AndroidManifest.xml || true

      - name: Setup Gradle Wrapper & Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
