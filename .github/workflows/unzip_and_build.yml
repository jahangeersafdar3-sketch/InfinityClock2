name: Unzip and Force Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          unzip -o InfinityClock-Part3.zip -d .

      - name: Auto-Fix Kotlin Syntax Errors
        run: |
          # Fix lifecycleScope issue in WidgetConfigurationActivity
          sed -i 's/lifecycleScope.launch/CoroutineScope(Dispatchers.Main).launch/g' app/src/main/java/com/infinityclock/app/widget/config/WidgetConfigurationActivity.kt || true
          
          # Fix unresolved references in InfinityWidgetContent
          sed -i 's/ColorProvider/androidx.glance.unit.ColorProvider/g' app/src/main/java/com/infinityclock/app/widget/InfinityWidgetContent.kt || true

      - name: Setup Gradle Wrapper & Force Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test --continue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
